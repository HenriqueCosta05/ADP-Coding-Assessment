name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, QA audit, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Comment policy (max 2 lines per comment block)
        run: npm run comments:check

      - name: QA audit (same rules as the Claude Code precheck hook)
        run: npm run qa:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
